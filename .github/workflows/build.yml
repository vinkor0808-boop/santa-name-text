name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Projekt erzeugen
        run: |
          mkdir -p work && cd work
          mkdir -p "$(dirname build.gradle)"
          cat > build.gradle <<'SANTA_EOF'
          plugins {
              id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          repositories {
              mavenCentral()
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 21
              it.options.encoding = 'UTF-8'
          }

          java {
              withSourcesJar()
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          SANTA_EOF
          mkdir -p "$(dirname gradle.properties)"
          cat > gradle.properties <<'SANTA_EOF'
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true

          # Fabric (Werte fuer 1.21.11, bei Bedarf auf https://fabricmc.net/develop pruefen)
          minecraft_version=1.21.11
          yarn_mappings=1.21.11+build.4
          loader_version=0.18.4
          loom_version=1.14-SNAPSHOT
          fabric_version=0.141.1+1.21.11

          # Mod
          mod_version=1.0.0
          maven_group=de.santa
          archives_base_name=santanametext
          SANTA_EOF
          mkdir -p "$(dirname settings.gradle)"
          cat > settings.gradle <<'SANTA_EOF'
          pluginManagement {
              repositories {
                  maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'santanametext'
          SANTA_EOF
          mkdir -p "$(dirname src/main/java/de/santa/santanametext/Effect.java)"
          cat > src/main/java/de/santa/santanametext/Effect.java <<'SANTA_EOF'
          package de.santa.santanametext;

          public enum Effect {
              SOLID("Einfarbig"), RAINBOW("Regenbogen"), GRADIENT("Verlauf A-B"), WAVE("Welle A-B"),
              METALLIC("Metallic"), FIRE("Feuer"), ICE("Eis"), PULSE("Pulsieren"), GLITTER("Glitzer");

              public final String label;
              Effect(String label) { this.label = label; }
              public Effect next() { return values()[(ordinal() + 1) % values().length]; }
          }
          SANTA_EOF
          mkdir -p "$(dirname src/main/java/de/santa/santanametext/FontStyle.java)"
          cat > src/main/java/de/santa/santanametext/FontStyle.java <<'SANTA_EOF'
          package de.santa.santanametext;

          import java.util.function.UnaryOperator;

          /** 30 Schrift-Stile. fontId != null: Minecraft-eigene Schriftart. */
          public enum FontStyle {
              NORMAL("Normal", s -> s, null),
              BOLD("Fett", Glyphs::bold, null),
              ITALIC("Kursiv", Glyphs::italic, null),
              BOLD_ITALIC("Fett Kursiv", Glyphs::boldItalic, null),
              SCRIPT("Schreibschrift", Glyphs::script, null),
              BOLD_SCRIPT("Schreibschrift fett", Glyphs::boldScript, null),
              FRAKTUR("Fraktur", Glyphs::fraktur, null),
              BOLD_FRAKTUR("Fraktur fett", Glyphs::boldFraktur, null),
              DOUBLE("Doppelstrich", Glyphs::doubleStruck, null),
              SANS("Sans", Glyphs::sans, null),
              SANS_BOLD("Sans fett", Glyphs::sansBold, null),
              SANS_ITALIC("Sans kursiv", Glyphs::sansItalic, null),
              SANS_BOLD_ITALIC("Sans fett kursiv", Glyphs::sansBoldItalic, null),
              MONO("Monospace", Glyphs::mono, null),
              FULLWIDTH("Breit", Glyphs::fullwidth, null),
              SMALL_CAPS("Kapitaelchen", Glyphs::smallCaps, null),
              CIRCLED("Kreise", Glyphs::circled, null),
              CIRCLED_NEG("Kreise voll", s -> Glyphs.letters(s, 0x1F150), null),
              SQUARED("Quadrate", s -> Glyphs.letters(s, 0x1F130), null),
              SQUARED_NEG("Quadrate voll", s -> Glyphs.letters(s, 0x1F170), null),
              SUPER("Hochgestellt", Glyphs::superscript, null),
              UPSIDE("Kopfstand", Glyphs::upsideDown, null),
              SPACED("Gesperrt", s -> Glyphs.join(s, " "), null),
              DOTTED("Punktiert", s -> Glyphs.join(s, "·"), null),
              BOLD_SPACED("Fett gesperrt", s -> Glyphs.join(Glyphs.bold(s), " "), null),
              SCRIPT_SPACED("Schreibschrift gesperrt", s -> Glyphs.join(Glyphs.script(s), " "), null),
              SMALL_CAPS_SPACED("Kapitaelchen gesperrt", s -> Glyphs.join(Glyphs.smallCaps(s), " "), null),
              GALACTIC("Galaktisch", s -> s, "alt"),
              ILLAGER("Illager", s -> s, "illageralt"),
              UNIFORM("Uniform", s -> s, "uniform");

              public final String label;
              public final String fontId;
              private final UnaryOperator<String> fn;

              FontStyle(String label, UnaryOperator<String> fn, String fontId) {
                  this.label = label;
                  this.fn = fn;
                  this.fontId = fontId;
              }

              public String apply(String s) { return fn.apply(s); }
          }
          SANTA_EOF
          mkdir -p "$(dirname src/main/java/de/santa/santanametext/Glyphs.java)"
          cat > src/main/java/de/santa/santanametext/Glyphs.java <<'SANTA_EOF'
          package de.santa.santanametext;

          import java.util.Map;
          import java.util.function.IntUnaryOperator;

          /** Unicode-Umwandlungen: aus normalem Text wird z.B. fette, kursive oder verschnoerkelte Schrift. */
          final class Glyphs {
              private Glyphs() {}

              static final Map<Character, Integer> ITALIC_EX = Map.of('h', 0x210E);
              static final Map<Character, Integer> SCRIPT_EX = Map.ofEntries(
                      Map.entry('B', 0x212C), Map.entry('E', 0x2130), Map.entry('F', 0x2131), Map.entry('H', 0x210B),
                      Map.entry('I', 0x2110), Map.entry('L', 0x2112), Map.entry('M', 0x2133), Map.entry('R', 0x211B),
                      Map.entry('e', 0x212F), Map.entry('g', 0x210A), Map.entry('o', 0x2134));
              static final Map<Character, Integer> FRAKTUR_EX = Map.of(
                      'C', 0x212D, 'H', 0x210C, 'I', 0x2111, 'R', 0x211C, 'Z', 0x2128);
              static final Map<Character, Integer> DOUBLE_EX = Map.of(
                      'C', 0x2102, 'H', 0x210D, 'N', 0x2115, 'P', 0x2119, 'Q', 0x211A, 'R', 0x211D, 'Z', 0x2124);

              static final String SMALL_CAPS = "ᴀʙᴄᴅᴇꜰɢʜɪᴊᴋʟᴍɴᴏᴘǫʀꜱᴛᴜᴠᴡxʏᴢ";
              static final String SUPER = "ᵃᵇᶜᵈᵉᶠᵍʰⁱʲᵏˡᵐⁿᵒᵖqʳˢᵗᵘᵛʷˣʸᶻ";
              static final String UPSIDE = "ɐqɔpǝɟƃɥᴉɾʞlɯuodbɹsʇnʌʍxʎz";

              static String map(String s, IntUnaryOperator f) {
                  StringBuilder sb = new StringBuilder();
                  s.codePoints().forEach(cp -> sb.appendCodePoint(f.applyAsInt(cp)));
                  return sb.toString();
              }

              static int letter(int cp) {
                  if (cp >= 'A' && cp <= 'Z') return cp - 'A';
                  if (cp >= 'a' && cp <= 'z') return cp - 'a';
                  return -1;
              }

              /** Mathematische Alphabete (fett, kursiv, Schreibschrift ...). digit < 0: Ziffern bleiben. */
              static String math(String s, int upper, int lower, int digit, Map<Character, Integer> ex) {
                  return map(s, cp -> {
                      if (ex != null && cp < 128) {
                          Integer e = ex.get((char) cp);
                          if (e != null) return e;
                      }
                      if (cp >= 'A' && cp <= 'Z') return upper + (cp - 'A');
                      if (cp >= 'a' && cp <= 'z') return lower + (cp - 'a');
                      if (digit >= 0 && cp >= '0' && cp <= '9') return digit + (cp - '0');
                      return cp;
                  });
              }

              static String bold(String s)         { return math(s, 0x1D400, 0x1D41A, 0x1D7CE, null); }
              static String italic(String s)       { return math(s, 0x1D434, 0x1D44E, -1, ITALIC_EX); }
              static String boldItalic(String s)   { return math(s, 0x1D468, 0x1D482, -1, null); }
              static String script(String s)       { return math(s, 0x1D49C, 0x1D4B6, -1, SCRIPT_EX); }
              static String boldScript(String s)   { return math(s, 0x1D4D0, 0x1D4EA, -1, null); }
              static String fraktur(String s)      { return math(s, 0x1D504, 0x1D51E, -1, FRAKTUR_EX); }
              static String boldFraktur(String s)  { return math(s, 0x1D56C, 0x1D586, -1, null); }
              static String doubleStruck(String s) { return math(s, 0x1D538, 0x1D552, 0x1D7D8, DOUBLE_EX); }
              static String sans(String s)         { return math(s, 0x1D5A0, 0x1D5BA, 0x1D7E2, null); }
              static String sansBold(String s)     { return math(s, 0x1D5D4, 0x1D5EE, 0x1D7EC, null); }
              static String sansItalic(String s)   { return math(s, 0x1D608, 0x1D622, -1, null); }
              static String sansBoldItalic(String s) { return math(s, 0x1D63C, 0x1D656, -1, null); }
              static String mono(String s)         { return math(s, 0x1D670, 0x1D68A, 0x1D7F6, null); }
              static String fullwidth(String s)    { return math(s, 0xFF21, 0xFF41, 0xFF10, null); }

              static String smallCaps(String s) {
                  return map(s, cp -> { int l = letter(cp); return l >= 0 ? SMALL_CAPS.charAt(l) : cp; });
              }

              static String superscript(String s) {
                  return map(s, cp -> {
                      int l = letter(cp);
                      if (l >= 0) return SUPER.charAt(l);
                      if (cp >= '0' && cp <= '9') return "⁰¹²³⁴⁵⁶⁷⁸⁹".charAt(cp - '0');
                      return cp;
                  });
              }

              static String upsideDown(String s) {
                  int[] cps = s.codePoints().toArray();
                  StringBuilder sb = new StringBuilder();
                  for (int i = cps.length - 1; i >= 0; i--) {
                      int l = letter(cps[i]);
                      sb.appendCodePoint(l >= 0 ? UPSIDE.charAt(l) : cps[i]);
                  }
                  return sb.toString();
              }

              static String circled(String s) {
                  return map(s, cp -> {
                      if (cp >= 'A' && cp <= 'Z') return 0x24B6 + (cp - 'A');
                      if (cp >= 'a' && cp <= 'z') return 0x24D0 + (cp - 'a');
                      if (cp == '0') return 0x24EA;
                      if (cp >= '1' && cp <= '9') return 0x2460 + (cp - '1');
                      return cp;
                  });
              }

              /** Nur Buchstaben, Gross- und Kleinbuchstaben werden gleich behandelt. */
              static String letters(String s, int base) {
                  return map(s, cp -> { int l = letter(cp); return l >= 0 ? base + l : cp; });
              }

              static String join(String s, String sep) {
                  int[] cps = s.codePoints().toArray();
                  StringBuilder sb = new StringBuilder();
                  for (int i = 0; i < cps.length; i++) {
                      if (i > 0) sb.append(sep);
                      sb.appendCodePoint(cps[i]);
                  }
                  return sb.toString();
              }
          }
          SANTA_EOF
          mkdir -p "$(dirname src/main/java/de/santa/santanametext/NameBuilder.java)"
          cat > src/main/java/de/santa/santanametext/NameBuilder.java <<'SANTA_EOF'
          package de.santa.santanametext;

          import net.minecraft.client.render.entity.state.EntityRenderState;
          import net.minecraft.text.MutableText;
          import net.minecraft.text.Style;
          import net.minecraft.text.StyleSpriteSource;
          import net.minecraft.text.Text;
          import net.minecraft.util.Identifier;
          import net.minecraft.util.Util;
          import net.minecraft.util.math.MathHelper;

          import java.util.ArrayList;
          import java.util.List;

          public final class NameBuilder {
              private NameBuilder() {}

              /** Render-State des eigenen Spielers (wird vom Mixin gesetzt). */
              public static EntityRenderState localState;

              public static double bounce() {
                  return SantaConfig.get().bounce ? Math.abs(Math.sin(Util.getMeasuringTimeMs() / 260.0)) * 0.12 : 0;
              }

              /** Prefix | Name (+ Zusaetze anderer Mods, z.B. Tiers, ganz rechts). */
              public static Text main(String playerName, Text original) {
                  SantaConfig c = SantaConfig.get();
                  MutableText out = Text.empty();
                  if (!c.prefix.text.isBlank()) {
                      out.append(styled(c.prefix, c.prefix.text));
                      String sep = c.separator.isBlank() ? " " : " " + c.separator.trim() + " ";
                      out.append(Text.literal(sep).setStyle(Style.EMPTY.withColor(c.sepColor)));
                  }
                  out.append(styled(c.name, playerName));
                  if (c.tiersRight && original != null) appendExtras(out, original, playerName);
                  return out;
              }

              /** Alles aus dem urspruenglichen Anzeigenamen, was nicht der Spielername ist, kommt ganz nach rechts. */
              private static void appendExtras(MutableText out, Text original, String playerName) {
                  List<Integer> cps = new ArrayList<>();
                  List<Style> styles = new ArrayList<>();
                  original.asOrderedText().accept((index, style, cp) -> {
                      cps.add(cp);
                      styles.add(style);
                      return true;
                  });
                  int[] nameCps = playerName.codePoints().toArray();
                  int at = -1;
                  for (int i = 0; i + nameCps.length <= cps.size() && at < 0; i++) {
                      boolean ok = true;
                      for (int j = 0; j < nameCps.length; j++) {
                          if (cps.get(i + j) != nameCps[j]) { ok = false; break; }
                      }
                      if (ok) at = i;
                  }
                  if (at < 0) return;

                  MutableText extras = Text.empty();
                  boolean any = false;
                  for (int i = 0; i < cps.size(); i++) {
                      if (i >= at && i < at + nameCps.length) continue;
                      int cp = cps.get(i);
                      if (!any && Character.isWhitespace(cp)) continue;
                      extras.append(Text.literal(new String(Character.toChars(cp))).setStyle(styles.get(i)));
                      if (!Character.isWhitespace(cp)) any = true;
                  }
                  if (any) {
                      out.append(Text.literal(" "));
                      out.append(extras);
                  }
              }

              public static Text line(SantaConfig.TagElement e) { return styled(e, e.text); }

              public static Text sample(FontStyle fs, boolean selected) {
                  Style st = Style.EMPTY.withColor(selected ? 0xFFD60A : 0xFFFFFF);
                  if (fs.fontId != null) st = st.withFont(new StyleSpriteSource.Font(Identifier.of("minecraft", fs.fontId)));
                  return Text.literal(fs.apply("Ab")).setStyle(st);
              }

              public static Text styled(SantaConfig.TagElement e, String raw) {
                  MutableText out = Text.empty();
                  String t = e.font.apply(raw);
                  Style base = Style.EMPTY.withBold(e.bold).withItalic(e.italic)
                          .withUnderline(e.underline).withStrikethrough(e.strike);
                  if (e.font.fontId != null) {
                      base = base.withFont(new StyleSpriteSource.Font(Identifier.of("minecraft", e.font.fontId)));
                  }
                  int[] cps = t.codePoints().toArray();
                  long time = Util.getMeasuringTimeMs();
                  for (int i = 0; i < cps.length; i++) {
                      int rgb = color(e.effect, i, cps.length, time, e.colorA, e.colorB);
                      out.append(Text.literal(new String(Character.toChars(cps[i]))).setStyle(base.withColor(rgb)));
                  }
                  return out;
              }

              private static int color(Effect e, int i, int n, long t, int a, int b) {
                  switch (e) {
                      case RAINBOW: {
                          float h = ((t / 1500f) + i * 0.07f) % 1f;
                          return MathHelper.hsvToRgb(h, 0.85f, 1f);
                      }
                      case GRADIENT:
                          return lerp(a, b, n > 1 ? i / (float) (n - 1) : 0f);
                      case WAVE: {
                          float p = (float) ((Math.sin(t / 500.0 - i * 0.45) + 1) / 2);
                          return lerp(a, b, p);
                      }
                      case METALLIC: {
                          double p = ((t / 90.0) - i * 1.2) % 12;
                          if (p < 0) p += 12;
                          float s = p < 3 ? (float) Math.sin(p / 3 * Math.PI) : 0f;
                          return lerp(a, 0xFFFFFF, s * 0.9f);
                      }
                      case FIRE: {
                          float f = (float) (Math.sin(t / 130.0 + i * 1.7) * 0.5 + 0.5);
                          return lerp(0xFF3B00, 0xFFD000, f);
                      }
                      case ICE: {
                          float f = (float) (Math.sin(t / 400.0 + i * 0.6) * 0.5 + 0.5);
                          return lerp(0x3FB8FF, 0xE8FBFF, f);
                      }
                      case PULSE: {
                          float f = (float) (0.65 + 0.35 * Math.sin(t / 300.0));
                          return lerp(0x000000, a, f);
                      }
                      case GLITTER:
                          return ((t / 120 + i * 7) % 9 == 0) ? 0xFFFFFF : a;
                      default:
                          return a;
                  }
              }

              private static int lerp(int a, int b, float p) {
                  int r = (int) (((a >> 16) & 255) + ((((b >> 16) & 255) - ((a >> 16) & 255)) * p));
                  int g = (int) (((a >> 8) & 255) + ((((b >> 8) & 255) - ((a >> 8) & 255)) * p));
                  int bl = (int) ((a & 255) + (((b & 255) - (a & 255)) * p));
                  return (r << 16) | (g << 8) | bl;
              }
          }
          SANTA_EOF
          mkdir -p "$(dirname src/main/java/de/santa/santanametext/SantaConfig.java)"
          cat > src/main/java/de/santa/santanametext/SantaConfig.java <<'SANTA_EOF'
          package de.santa.santanametext;

          import com.google.gson.Gson;
          import com.google.gson.GsonBuilder;
          import net.fabricmc.loader.api.FabricLoader;

          import java.nio.file.Files;
          import java.nio.file.Path;

          public class SantaConfig {
              public boolean enabled = true, bounce = false, tiersRight = true;
              public String separator = "|";
              public int sepColor = 0x9AA0A6;

              public TagElement prefix = new TagElement("SANTA", FontStyle.BOLD, Effect.RAINBOW, 0xFF3355, 0xFFD000);
              public TagElement name = new TagElement("", FontStyle.NORMAL, Effect.METALLIC, 0x7A838C, 0xFFFFFF);
              public TagElement top = new TagElement("tiktok: @santa", FontStyle.NORMAL, Effect.GRADIENT, 0xFF3355, 0xFFD000);
              public TagElement bottom = new TagElement("", FontStyle.NORMAL, Effect.SOLID, 0xFFFFFF, 0xFFD000);

              /** Ein Baustein des Nametags (Prefix, Name, Zeile oben, Zeile unten). */
              public static class TagElement {
                  public String text = "";
                  public FontStyle font = FontStyle.NORMAL;
                  public Effect effect = Effect.SOLID;
                  public int colorA = 0xFFFFFF, colorB = 0xFFD000;
                  public boolean bold, italic, underline, strike;

                  public TagElement() {}

                  public TagElement(String text, FontStyle font, Effect effect, int a, int b) {
                      this.text = text; this.font = font; this.effect = effect; this.colorA = a; this.colorB = b;
                  }

                  void fix() {
                      if (text == null) text = "";
                      if (font == null) font = FontStyle.NORMAL;
                      if (effect == null) effect = Effect.SOLID;
                  }
              }

              private void fix() {
                  if (separator == null) separator = "";
                  if (prefix == null) prefix = new TagElement("SANTA", FontStyle.BOLD, Effect.RAINBOW, 0xFF3355, 0xFFD000);
                  if (name == null) name = new TagElement("", FontStyle.NORMAL, Effect.METALLIC, 0x7A838C, 0xFFFFFF);
                  if (top == null) top = new TagElement("", FontStyle.NORMAL, Effect.GRADIENT, 0xFF3355, 0xFFD000);
                  if (bottom == null) bottom = new TagElement("", FontStyle.NORMAL, Effect.SOLID, 0xFFFFFF, 0xFFD000);
                  prefix.fix(); name.fix(); top.fix(); bottom.fix();
              }

              private static final Gson GSON = new GsonBuilder().setPrettyPrinting().create();
              private static final Path FILE = FabricLoader.getInstance().getConfigDir().resolve("santanametext_v2.json");
              private static SantaConfig inst;

              public static SantaConfig get() {
                  if (inst == null) {
                      try { inst = GSON.fromJson(Files.readString(FILE), SantaConfig.class); } catch (Exception ignored) {}
                      if (inst == null) inst = new SantaConfig();
                      inst.fix();
                  }
                  return inst;
              }

              public static void save() {
                  try { Files.writeString(FILE, GSON.toJson(get())); } catch (Exception ignored) {}
              }
          }
          SANTA_EOF
          mkdir -p "$(dirname src/main/java/de/santa/santanametext/SantaNameText.java)"
          cat > src/main/java/de/santa/santanametext/SantaNameText.java <<'SANTA_EOF'
          package de.santa.santanametext;

          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.util.InputUtil;
          import org.lwjgl.glfw.GLFW;

          public class SantaNameText implements ClientModInitializer {
              @Override
              public void onInitializeClient() {
                  SantaConfig.get();
                  KeyBinding key = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                          "key.santanametext.menu", InputUtil.Type.KEYSYM, GLFW.GLFW_KEY_RIGHT_SHIFT, KeyBinding.Category.MISC));
                  ClientTickEvents.END_CLIENT_TICK.register(mc -> {
                      while (key.wasPressed()) {
                          if (mc.currentScreen == null) mc.setScreen(new SantaScreen(null));
                      }
                  });
              }
          }
          SANTA_EOF
          mkdir -p "$(dirname src/main/java/de/santa/santanametext/SantaScreen.java)"
          cat > src/main/java/de/santa/santanametext/SantaScreen.java <<'SANTA_EOF'
          package de.santa.santanametext;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.client.gui.widget.ButtonWidget;
          import net.minecraft.client.gui.widget.TextFieldWidget;
          import net.minecraft.text.Style;
          import net.minecraft.text.Text;

          import java.util.function.Consumer;
          import java.util.function.Supplier;

          /** Glas-Menue: Tabs (Prefix / Name / Oben / Unten), 30 Schriften, Effekte, Farben, Live-Vorschau. */
          public class SantaScreen extends Screen {
              private static final int[] SWATCHES = {
                      0xFF3B30, 0xFF9500, 0xFFD60A, 0x9BEA2C, 0x30D158, 0x00C7BE,
                      0x32D4FF, 0x0A84FF, 0x5E5CE6, 0xBF5AF2, 0xFF2D92, 0xFFFFFF};
              private static final String[] TAB_NAMES = {"Prefix", "Name", "Oben", "Unten"};

              private final Screen parent;
              private final SantaConfig c = SantaConfig.get();
              private int tab = 1;
              private int px, py, pw, ph;
              private TextFieldWidget fieldA, fieldB;

              public SantaScreen(Screen parent) {
                  super(Text.literal("Santa Name Text"));
                  this.parent = parent;
              }

              private SantaConfig.TagElement cur() {
                  switch (tab) {
                      case 0: return c.prefix;
                      case 1: return c.name;
                      case 2: return c.top;
                      default: return c.bottom;
                  }
              }

              @Override
              protected void init() {
                  pw = Math.min(width - 10, 420);
                  ph = Math.min(height - 10, 252);
                  px = (width - pw) / 2;
                  py = (height - ph) / 2;
                  int inner = pw - 20;
                  int colW = (inner - 10) / 2;
                  int L = px + 10;
                  int R = L + colW + 10;
                  SantaConfig.TagElement e = cur();

                  // Tabs
                  int y = py + 70;
                  int tw = (inner - 12) / 4;
                  for (int i = 0; i < 4; i++) {
                      final int idx = i;
                      addDrawableChild(ButtonWidget.builder(Text.literal((tab == idx ? "> " : "") + TAB_NAMES[idx]), b -> {
                          tab = idx;
                          clearAndInit();
                      }).dimensions(L + i * (tw + 4), y, tw, 18).build());
                  }

                  // Text (nicht beim Namen)
                  y += 24;
                  if (tab == 1) {
                      ButtonWidget b = ButtonWidget.builder(Text.literal("(dein Spielername)"), x -> {})
                              .dimensions(L, y, colW, 18).build();
                      b.active = false;
                      addDrawableChild(b);
                  } else {
                      field(L, y, colW, tab == 0 ? "Prefix-Text" : "Zeile", e.text, 40, s -> e.text = s);
                  }

                  // Effekt
                  y += 22;
                  addDrawableChild(ButtonWidget.builder(Text.literal("Effekt: " + e.effect.label), b -> {
                      e.effect = e.effect.next();
                      b.setMessage(Text.literal("Effekt: " + e.effect.label));
                  }).dimensions(L, y, colW, 18).build());

                  // Farben (Hex)
                  y += 22;
                  int hw = (colW - 4) / 2;
                  fieldA = field(L, y, hw, "Farbe A", hex(e.colorA), 7, s -> e.colorA = parseHex(s, e.colorA));
                  fieldB = field(L + hw + 4, y, hw, "Farbe B", hex(e.colorB), 7, s -> e.colorB = parseHex(s, e.colorB));

                  // Farbfelder: Reihe A, Reihe B
                  y += 22;
                  swatches(L, y, colW, col -> { e.colorA = col; fieldA.setText(hex(col)); });
                  y += 16;
                  swatches(L, y, colW, col -> { e.colorB = col; fieldB.setText(hex(col)); });

                  // Fett / Kursiv / Unterstrichen / Durchgestrichen
                  y += 18;
                  int sw = (colW - 9) / 4;
                  styleToggle(L, y, sw, "B", Style.EMPTY.withBold(true), () -> e.bold, v -> e.bold = v);
                  styleToggle(L + (sw + 3), y, sw, "I", Style.EMPTY.withItalic(true), () -> e.italic, v -> e.italic = v);
                  styleToggle(L + 2 * (sw + 3), y, sw, "U", Style.EMPTY.withUnderline(true), () -> e.underline, v -> e.underline = v);
                  styleToggle(L + 3 * (sw + 3), y, sw, "S", Style.EMPTY.withStrikethrough(true), () -> e.strike, v -> e.strike = v);

                  // Schrift-Raster (rechts): 5 Spalten x 6 Reihen = 30 Stile
                  FontStyle[] fonts = FontStyle.values();
                  int gy = py + 94;
                  int bw = (colW - 8) / 5;
                  for (int i = 0; i < fonts.length; i++) {
                      final FontStyle fs = fonts[i];
                      int gx = R + (i % 5) * (bw + 2);
                      int gyy = gy + (i / 5) * 18;
                      addDrawableChild(ButtonWidget.builder(NameBuilder.sample(fs, fs == e.font), b -> {
                          e.font = fs;
                          clearAndInit();
                      }).dimensions(gx, gyy, bw, 16).build());
                  }

                  // Unten: globale Schalter
                  int by = py + ph - 26;
                  int aw = (inner - 4 * 6 - 60 - 66) / 3;
                  int bx = L;
                  toggle(bx, by, aw, "Aktiv", () -> c.enabled, v -> c.enabled = v);
                  bx += aw + 6;
                  toggle(bx, by, aw, "Bounce", () -> c.bounce, v -> c.bounce = v);
                  bx += aw + 6;
                  toggle(bx, by, aw, "Tiers rechts", () -> c.tiersRight, v -> c.tiersRight = v);
                  bx += aw + 6;
                  field(bx, by, 60, "Trenner", c.separator, 3, s -> c.separator = s);
                  bx += 66;
                  addDrawableChild(ButtonWidget.builder(Text.literal("Fertig"), b -> close())
                          .dimensions(bx, by, 60, 18).build());
              }

              private TextFieldWidget field(int x, int y, int w, String hint, String value, int max, Consumer<String> set) {
                  TextFieldWidget f = new TextFieldWidget(textRenderer, x, y, w, 18, Text.literal(hint));
                  f.setMaxLength(max);
                  f.setPlaceholder(Text.literal(hint));
                  f.setText(value);
                  f.setChangedListener(set);
                  addDrawableChild(f);
                  return f;
              }

              private void toggle(int x, int y, int w, String name, Supplier<Boolean> get, Consumer<Boolean> set) {
                  addDrawableChild(ButtonWidget.builder(toggleLabel(name, get.get()), b -> {
                      set.accept(!get.get());
                      b.setMessage(toggleLabel(name, get.get()));
                  }).dimensions(x, y, w, 18).build());
              }

              private static Text toggleLabel(String name, boolean on) {
                  return Text.literal(name + ": " + (on ? "An" : "Aus"))
                          .setStyle(Style.EMPTY.withColor(on ? 0x7CFC9A : 0xFFFFFF));
              }

              private void styleToggle(int x, int y, int w, String letter, Style fmt, Supplier<Boolean> get, Consumer<Boolean> set) {
                  addDrawableChild(ButtonWidget.builder(styleLabel(letter, fmt, get.get()), b -> {
                      set.accept(!get.get());
                      b.setMessage(styleLabel(letter, fmt, get.get()));
                  }).dimensions(x, y, w, 18).build());
              }

              private static Text styleLabel(String letter, Style fmt, boolean on) {
                  return Text.literal(letter).setStyle(fmt.withColor(on ? 0xFFD60A : 0xFFFFFF));
              }

              private void swatches(int x, int y, int totalW, Consumer<Integer> pick) {
                  int n = SWATCHES.length;
                  int w = (totalW - (n - 1) * 2) / n;
                  for (int i = 0; i < n; i++) {
                      final int col = SWATCHES[i];
                      addDrawableChild(ButtonWidget.builder(
                              Text.literal("█").setStyle(Style.EMPTY.withColor(col)), b -> pick.accept(col))
                              .dimensions(x + i * (w + 2), y, w, 14).build());
                  }
              }

              private static String hex(int rgb) { return String.format("%06X", rgb & 0xFFFFFF); }

              private static int parseHex(String s, int fallback) {
                  try { return Integer.parseInt(s.replace("#", "").trim(), 16) & 0xFFFFFF; } catch (Exception ex) { return fallback; }
              }

              @Override
              public void render(DrawContext ctx, int mx, int my, float delta) {
                  // Glas-Panel
                  ctx.fill(px, py, px + pw, py + ph, 0xB0121A24);
                  ctx.fillGradient(px, py, px + pw, py + 66, 0x38FFFFFF, 0x08FFFFFF);
                  ctx.fill(px, py, px + pw, py + 1, 0x90FFFFFF);
                  ctx.fill(px, py + ph - 1, px + pw, py + ph, 0x40FFFFFF);
                  ctx.fill(px, py, px + 1, py + ph, 0x60FFFFFF);
                  ctx.fill(px + pw - 1, py, px + pw, py + ph, 0x40FFFFFF);
                  // Vorschau-Kasten
                  ctx.fill(px + 10, py + 8, px + pw - 10, py + 62, 0x66000000);

                  super.render(ctx, mx, my, delta);

                  int cx = px + pw / 2;
                  MinecraftClient mc = MinecraftClient.getInstance();
                  String name = mc.player != null ? mc.player.getName().getString() : "DeinName";
                  ctx.drawCenteredTextWithShadow(textRenderer, Text.literal("Santa Name Text  -  Vorschau"), cx, py + 11, 0xFFB0B8C0);
                  int ly = py + 24;
                  if (!c.top.text.isBlank()) {
                      ctx.drawCenteredTextWithShadow(textRenderer, NameBuilder.line(c.top), cx, ly, 0xFFFFFFFF);
                      ly += 12;
                  }
                  ctx.drawCenteredTextWithShadow(textRenderer, NameBuilder.main(name, null), cx, ly, 0xFFFFFFFF);
                  ly += 12;
                  if (!c.bottom.text.isBlank()) {
                      ctx.drawCenteredTextWithShadow(textRenderer, NameBuilder.line(c.bottom), cx, ly, 0xFFFFFFFF);
                  }

                  FontStyle fs = cur().font;
                  int colW = (pw - 20 - 10) / 2;
                  int R = px + 10 + colW + 10;
                  ctx.drawTextWithShadow(textRenderer, "Schrift: " + fs.label + " (" + (fs.ordinal() + 1) + "/" + FontStyle.values().length + ")",
                          R, py + 94 + 6 * 18 + 2, 0xFFB0B8C0);
              }

              @Override
              public void removed() { SantaConfig.save(); }

              @Override
              public void close() { client.setScreen(parent); }
          }
          SANTA_EOF
          mkdir -p "$(dirname src/main/java/de/santa/santanametext/mixin/EntityRendererMixin.java)"
          cat > src/main/java/de/santa/santanametext/mixin/EntityRendererMixin.java <<'SANTA_EOF'
          package de.santa.santanametext.mixin;

          import de.santa.santanametext.NameBuilder;
          import de.santa.santanametext.SantaConfig;
          import net.minecraft.client.render.command.OrderedRenderCommandQueue;
          import net.minecraft.client.render.entity.EntityRenderer;
          import net.minecraft.client.render.entity.state.EntityRenderState;
          import net.minecraft.client.render.state.CameraRenderState;
          import net.minecraft.client.util.math.MatrixStack;
          import net.minecraft.text.Text;
          import net.minecraft.util.math.Vec3d;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.Shadow;
          import org.spongepowered.asm.mixin.Unique;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;

          /** Rendert nach dem normalen Namen noch die Zusatzzeilen darueber und darunter. */
          @Mixin(EntityRenderer.class)
          public abstract class EntityRendererMixin {
              @Unique private static boolean santa$busy;

              @Shadow
              protected abstract void renderLabelIfPresent(EntityRenderState state, MatrixStack matrices,
                                                           OrderedRenderCommandQueue queue, CameraRenderState camera);

              @Inject(method = "renderLabelIfPresent", at = @At("TAIL"))
              private void santa$extra(EntityRenderState state, MatrixStack matrices, OrderedRenderCommandQueue queue,
                                       CameraRenderState camera, CallbackInfo ci) {
                  if (santa$busy || state != NameBuilder.localState || state.nameLabelPos == null) return;
                  SantaConfig c = SantaConfig.get();
                  if (!c.enabled) return;

                  Text oldName = state.displayName;
                  Vec3d oldPos = state.nameLabelPos;
                  santa$busy = true;
                  try {
                      if (!c.top.text.isBlank()) {
                          state.displayName = NameBuilder.line(c.top);
                          state.nameLabelPos = oldPos.add(0, 0.27, 0);
                          renderLabelIfPresent(state, matrices, queue, camera);
                      }
                      if (!c.bottom.text.isBlank()) {
                          state.displayName = NameBuilder.line(c.bottom);
                          state.nameLabelPos = oldPos.add(0, -0.27, 0);
                          renderLabelIfPresent(state, matrices, queue, camera);
                      }
                  } finally {
                      state.displayName = oldName;
                      state.nameLabelPos = oldPos;
                      santa$busy = false;
                  }
              }
          }
          SANTA_EOF
          mkdir -p "$(dirname src/main/java/de/santa/santanametext/mixin/PlayerRendererMixin.java)"
          cat > src/main/java/de/santa/santanametext/mixin/PlayerRendererMixin.java <<'SANTA_EOF'
          package de.santa.santanametext.mixin;

          import de.santa.santanametext.NameBuilder;
          import de.santa.santanametext.SantaConfig;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.render.entity.PlayerEntityRenderer;
          import net.minecraft.client.render.entity.state.PlayerEntityRenderState;
          import net.minecraft.entity.Entity;
          import net.minecraft.entity.PlayerLikeEntity;
          import net.minecraft.util.math.Vec3d;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;

          @Mixin(PlayerEntityRenderer.class)
          public class PlayerRendererMixin {
              // In 1.21.11 ist der erste Parameter (nach Typ-Loeschung) PlayerLikeEntity.
              @Inject(method = "updateRenderState(Lnet/minecraft/entity/PlayerLikeEntity;Lnet/minecraft/client/render/entity/state/PlayerEntityRenderState;F)V",
                      at = @At("TAIL"))
              private void santa$name(PlayerLikeEntity player, PlayerEntityRenderState state, float tickDelta, CallbackInfo ci) {
                  Object self = player;
                  if (self != (Object) MinecraftClient.getInstance().player || !SantaConfig.get().enabled) return;
                  Entity entity = (Entity) self;
                  NameBuilder.localState = state;
                  // Vanilla zeigt den eigenen Namen nie an (Label ist null) -> hier selbst setzen.
                  state.displayName = NameBuilder.main(entity.getName().getString(), state.displayName);
                  Vec3d pos = state.nameLabelPos != null ? state.nameLabelPos : new Vec3d(0, entity.getHeight(), 0);
                  state.nameLabelPos = pos.add(0, NameBuilder.bounce(), 0);
              }
          }
          SANTA_EOF
          mkdir -p "$(dirname src/main/resources/assets/santanametext/lang/en_us.json)"
          cat > src/main/resources/assets/santanametext/lang/en_us.json <<'SANTA_EOF'
          { "key.santanametext.menu": "Open Santa Name Text menu" }
          SANTA_EOF
          mkdir -p "$(dirname src/main/resources/fabric.mod.json)"
          cat > src/main/resources/fabric.mod.json <<'SANTA_EOF'
          {
            "schemaVersion": 1,
            "id": "santanametext",
            "version": "1.0.0",
            "name": "Santa Name Text",
            "description": "Eigener Nametag: Logos, Prefix, Zusatzzeilen und Texteffekte.",
            "authors": ["Santa"],
            "environment": "client",
            "entrypoints": { "client": ["de.santa.santanametext.SantaNameText"] },
            "mixins": ["santanametext.mixins.json"],
            "depends": { "fabricloader": ">=0.16.0", "minecraft": "~1.21.11", "java": ">=21", "fabric-api": "*" }
          }
          SANTA_EOF
          mkdir -p "$(dirname src/main/resources/santanametext.mixins.json)"
          cat > src/main/resources/santanametext.mixins.json <<'SANTA_EOF'
          {
            "required": true,
            "package": "de.santa.santanametext.mixin",
            "compatibilityLevel": "JAVA_21",
            "client": ["PlayerRendererMixin", "EntityRendererMixin"],
            "injectors": { "defaultRequire": 1 }
          }
          SANTA_EOF
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - name: Mod bauen
        working-directory: work
        run: gradle build --no-daemon
      - name: JAR pruefen
        run: |
          unzip -l work/build/libs/santanametext-1.0.0.jar
          unzip -p work/build/libs/santanametext-1.0.0.jar de/santa/santanametext/mixin/PlayerRendererMixin.class | strings | grep -i -E "updateRenderState|method_|PlayerLike|class_" || true
      - uses: actions/upload-artifact@v4
        with:
          name: santanametext-jar
          path: work/build/libs/santanametext-1.0.0.jar
