            "name": "Santa Name Text",
            "description": "Client-side custom nametag: prefix, suffix, extra lines above/below, text effects, 40 font styles, colour picker and a glass menu. Tier mod compatible.",
            "authors": ["Santa"],
            "license": "MIT",
            "icon": "assets/santanametext/icon.png",
            "environment": "client",
            "entrypoints": { "client": ["de.santa.santanametext.SantaNameText"] },
            "mixins": ["santanametext.mixins.json"],
            "depends": { "fabricloader": ">=0.16.0", "minecraft": "~1.21.11", "java": ">=21", "fabric-api": "*" }
          }
          SANTA_EOF
          mkdir -p "$(dirname src/main/resources/santanametext.mixins.json)"
          cat > src/main/resources/santanametext.mixins.json <<'SANTA_EOF'
          {
            "required": true,
            "package": "de.santa.santanametext.mixin",
            "compatibilityLevel": "JAVA_21",
            "client": ["PlayerRendererMixin"],
            "injectors": { "defaultRequire": 1 }
          }
          SANTA_EOF
      - name: Quellcode ins Repo schreiben (Open Source)
        continue-on-error: true
        run: |
          cp -r work/src work/build.gradle work/gradle.properties work/settings.gradle work/LICENSE work/README.md work/MODRINTH.md work/.gitignore ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src build.gradle gradle.properties settings.gradle LICENSE README.md MODRINTH.md .gitignore
          git diff --cached --quiet || (git commit -m "Update sources" && git push)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - name: Mod bauen
        working-directory: work
        run: gradle build --no-daemon
      - name: JAR pruefen
        run: |
          unzip -l work/build/libs/santanametext-1.0.0.jar
          unzip -p work/build/libs/santanametext-1.0.0.jar de/santa/santanametext/mixin/PlayerRendererMixin.class | strings | grep -i -E "updateRenderState|method_|PlayerLike|class_" || true
      - uses: actions/upload-artifact@v4
        with:
          name: santanametext-jar
          path: work/build/libs/santanametext-1.0.0.jar
