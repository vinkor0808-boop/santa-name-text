name: Build Santa OreSim

on:
  push:
    tags:
      - 'oresim-v*'
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v5

      - name: Java 25 einrichten (Gradle/Loom; Mod wird fuer Java 21 kompiliert)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v5

      - name: Bauen
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log

      - name: Fehler anzeigen
        if: failure()
        run: |
          grep -E "error:|\.java:[0-9]+|What went wrong|Could not|> " build.log | grep -v "^> Task" | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: JAR hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Santa-OreSim
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Test-Build veröffentlichen
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="oresim-build-${GITHUB_RUN_NUMBER}"
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --title "Santa OreSim Build ${GITHUB_RUN_NUMBER}" --notes "Automatischer Build" --prerelease

      - name: Offizielles Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/oresim-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          gh release create "$TAG" "$JAR" --verify-tag --title "Santa OreSim ${TAG#oresim-v}" --notes-file CHANGELOG.md
