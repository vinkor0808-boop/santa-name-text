name: Dump MC sources
on:
  push:
    branches: [mcsrc-dump]
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v5
      - name: genSources
        run: |
          chmod +x ./gradlew
          ./gradlew genSources --stacktrace 2>&1 | tail -20
      - name: Collect
        run: |
          set -x
          mkdir -p /tmp/out
          find / -name "*.jar" 2>/dev/null | grep -iE "minecraft.*sources|sources.*minecraft" | tee /tmp/out/jars.txt
          for J in $(cat /tmp/out/jars.txt); do
            (cd /tmp/out && unzip -oq "$J" \
              'net/minecraft/world/gen/feature/Ore*' 'net/minecraft/world/gen/feature/ScatteredOreFeature.java' \
              'net/minecraft/world/gen/feature/PlacedFeature*' 'net/minecraft/world/gen/feature/Feature.java' \
              'net/minecraft/world/gen/feature/MiscPlacedFeatures.java' 'net/minecraft/world/gen/feature/NetherPlacedFeatures.java' \
              'net/minecraft/world/gen/feature/NetherConfiguredFeatures.java' 'net/minecraft/world/gen/feature/DefaultBiomeFeatures.java' \
              'net/minecraft/world/gen/feature/util/*' 'net/minecraft/world/gen/placementmodifier/*' \
              'net/minecraft/world/gen/heightprovider/*' 'net/minecraft/world/gen/YOffset.java' 'net/minecraft/world/gen/HeightContext.java' \
              'net/minecraft/world/gen/chunk/ChunkGenerator.java' 'net/minecraft/world/gen/GenerationStep.java' \
              'net/minecraft/world/biome/Biome.java' 'net/minecraft/world/biome/GenerationSettings.java' 'net/minecraft/world/biome/source/*' \
              'net/minecraft/util/math/random/*' 'net/minecraft/registry/BuiltinRegistries.java' 'net/minecraft/registry/RegistryWrapper.java' \
              'net/minecraft/client/render/RenderLayer*' 'net/minecraft/client/render/RenderPhase.java' 'net/minecraft/client/render/VertexRendering.java' \
              'net/minecraft/client/render/RenderSetup*' 'net/minecraft/client/render/LayeringTransform*' 'net/minecraft/client/render/OutputTarget*' \
              'net/minecraft/client/gl/RenderPipelines.java' 'net/minecraft/client/render/debug/DebugRenderer.java' \
              'net/minecraft/client/render/WorldRenderer.java' 'net/minecraft/client/render/VertexConsumerProvider.java' \
              'com/mojang/blaze3d/pipeline/RenderPipeline.java' 'net/minecraft/client/render/DrawStyle*' 'net/minecraft/client/render/debug/*Gizmo*' 'net/minecraft/world/debug/gizmo/*' \
              2>/dev/null || true)
          done
          find / -name "fabric-rendering-v1*sources*.jar" 2>/dev/null | head -3 | tee -a /tmp/out/jars.txt | while read J; do (cd /tmp/out && unzip -oq "$J" '*.java' -d fabric-rendering || true); done
          find / -name "fabric-command-api-v2*sources*.jar" 2>/dev/null | head -1 | while read J; do (cd /tmp/out && unzip -oq "$J" '*.java' -d fabric-command || true); done
          find / -name "fabric-rendering-v1*.jar" 2>/dev/null | head -5 >> /tmp/out/jars.txt
          find /tmp/out -type f | wc -l
      - name: Push
        run: |
          cd /tmp/out
          git init -q -b mcsrc && git add -A
          git -c user.name=ci -c user.email=ci@x commit -qm dump
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" mcsrc
