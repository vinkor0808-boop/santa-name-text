name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Projekt erzeugen
        run: |
          mkdir -p work && cd work
          mkdir -p "$(dirname .gitignore)"
          cat > .gitignore <<'SANTA_EOF'
          build/
          .gradle/
          work/
          *.class
          .idea/
          run/
          SANTA_EOF
          mkdir -p "$(dirname LICENSE)"
          cat > LICENSE <<'SANTA_EOF'
          MIT License

          Copyright (c) 2026 Santa

          Permission is hereby granted, free of charge, to any person obtaining a copy
          of this software and associated documentation files (the "Software"), to deal
          in the Software without restriction, including without limitation the rights
          to use, copy, modify, merge, publish, distribute, sublicense, and/or sell
          copies of the Software, and to permit persons to whom the Software is
          furnished to do so, subject to the following conditions:

          The above copyright notice and this permission notice shall be included in all
          copies or substantial portions of the Software.

          THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
          IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
          FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE
          AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER
          LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,
          OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
          SOFTWARE.
          SANTA_EOF
          mkdir -p "$(dirname MODRINTH.md)"
          cat > MODRINTH.md <<'SANTA_EOF'
          # Modrinth publishing sheet (copy into the Modrinth project form)

          **Name:** Santa Name Text
          **Summary (max 256):** Client-side custom nametag: prefix, suffix, lines above/below, 20 text effects, 40 fonts, colour picker and a rounded glass menu.
          **Categories:** Cosmetic, Utility
          **Environment:** Client: required - Server: unsupported
          **License:** MIT (open source)
          **Loader:** Fabric - **Game version:** 1.21.11
          **Dependencies:** Fabric API (required)
          **Icon:** assets/santanametext/icon.png (in the repo)
          **Source:** your GitHub repository URL

          ## Description
          Santa Name Text lets you design your own nametag, fully client-side.

          - Prefix, name, suffix and a colourable separator
          - Extra lines above and below your name
          - 20 animated text effects with live previews
          - 40 font styles, bold / italic / underline / strikethrough
          - HSV colour picker, hex input, swatches, live preview
          - Tier mods: show the tier left, right or hide it
          - Rounded glass menu, open with K (rebindable)

          Your own tag is only visible in third person (F5). Other players do not see it.

          ## Version 1.0.0 changelog
          - First release
          SANTA_EOF
          mkdir -p "$(dirname README.md)"
          cat > README.md <<'SANTA_EOF'
          # Santa Name Text

          Client-side Fabric mod for Minecraft **1.21.11** (Fabric Loader >= 0.16, Fabric API, Java 21).
          Open source, MIT license.

          ## Features
          - Own nametag: **prefix**, **name**, **suffix**, freely colourable **separator**
          - Extra lines **above** and **below** the name
          - 20 text effects (rainbow, gradient, metallic, shimmer, chromatic, fade, glowing, fire, ...), live animated previews
          - 40 font styles (Unicode styles + Minecraft fonts), bold / italic / underline / strikethrough
          - HSV colour picker, hex input, colour swatches, always-visible live preview
          - Tier mods: tier can be shown **left**, **right** or hidden
          - Rounded glass menu - open with **K** (rebindable in Controls)

          Note: Minecraft hides your own nametag - you see it in third person (F5). Other players do not see it; it is purely client-side.

          ## Deutsch
          Eigener Nametag mit Prefix, Suffix, Trenner, Zeilen ueber/unter dem Namen, Effekten, 40 Schriften und Farbwaehler.
          Menue: Taste K (aenderbar unter Steuerung). Den eigenen Tag siehst du nur in der Third-Person-Ansicht (F5), andere sehen ihn nicht.

          ## Build
          ```
          gradle build        # Java 21, Gradle 9.2.1
          ```
          Result: `build/libs/santanametext-<version>.jar` (use the one without `-sources`).
          The included GitHub workflow builds the mod and uploads it as the artifact `santanametext-jar`.

          ## Contributing
          Issues and pull requests are welcome. The code lives in `src/main/java/de/santa/santanametext`:
          `NameBuilder` (text/effects), `FontStyle`/`Glyphs` (fonts), `SantaScreen`/`Ui` (menu), `mixin/PlayerRendererMixin` (rendering).
          SANTA_EOF
          mkdir -p "$(dirname build.gradle)"
          cat > build.gradle <<'SANTA_EOF'
          plugins {
              id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          repositories {
              mavenCentral()
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 21
              it.options.encoding = 'UTF-8'
          }

          java {
              withSourcesJar()
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          SANTA_EOF
          mkdir -p "$(dirname gradle.properties)"
          cat > gradle.properties <<'SANTA_EOF'
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true

          # Fabric (Werte fuer 1.21.11, bei Bedarf auf https://fabricmc.net/develop pruefen)
          minecraft_version=1.21.11
          yarn_mappings=1.21.11+build.4
          loader_version=0.18.4
          loom_version=1.14-SNAPSHOT
          fabric_version=0.141.1+1.21.11

          # Mod
          mod_version=1.0.0
          maven_group=de.santa
          archives_base_name=santanametext
          SANTA_EOF
          mkdir -p "$(dirname settings.gradle)"
          cat > settings.gradle <<'SANTA_EOF'
          pluginManagement {
              repositories {
                  maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'santanametext'
          SANTA_EOF
          mkdir -p "$(dirname src/main/java/de/santa/santanametext/Effect.java)"
          cat > src/main/java/de/santa/santanametext/Effect.java <<'SANTA_EOF'
          package de.santa.santanametext;

          public enum Effect {
              SOLID("Einfarbig"), RAINBOW("Regenbogen"), GRADIENT("Verlauf"), WAVE("Welle"),
              METALLIC("Metallic"), SHIMMER("Shimmer"), CHROMATIC("Chromatic"), FADE("Fade"),
              GLOWING("Glowing"), ITERATING("Iterating"), NEON("Neon"), BLINK("Blinken"),
              FIRE("Feuer"), ICE("Eis"), SUNSET("Sunset"), OCEAN("Ozean"),
              CANDY("Candy"), MATRIX("Matrix"), PULSE("Pulsieren"), GLITTER("Glitzer");

              public final String label;
              Effect(String label) { this.label = label; }
              public Effect next() { return values()[(ordinal() + 1) % values().length]; }
          }
          SANTA_EOF
          mkdir -p "$(dirname src/main/java/de/santa/santanametext/FontStyle.java)"
          cat > src/main/java/de/santa/santanametext/FontStyle.java <<'SANTA_EOF'
          package de.santa.santanametext;

          import java.util.function.UnaryOperator;

          /** 40 Schrift-Stile. fontId != null: Minecraft-eigene Schriftart. */
          public enum FontStyle {
              NORMAL("Normal", s -> s, null),
              BOLD("Fett", Glyphs::bold, null),
              ITALIC("Kursiv", Glyphs::italic, null),
              BOLD_ITALIC("Fett Kursiv", Glyphs::boldItalic, null),
              SCRIPT("Schreibschrift", Glyphs::script, null),
              BOLD_SCRIPT("Schreibschrift fett", Glyphs::boldScript, null),
              FRAKTUR("Fraktur", Glyphs::fraktur, null),
              BOLD_FRAKTUR("Fraktur fett", Glyphs::boldFraktur, null),
              DOUBLE("Doppelstrich", Glyphs::doubleStruck, null),
              SANS("Sans", Glyphs::sans, null),
              SANS_BOLD("Sans fett", Glyphs::sansBold, null),
              SANS_ITALIC("Sans kursiv", Glyphs::sansItalic, null),
              SANS_BOLD_ITALIC("Sans fett kursiv", Glyphs::sansBoldItalic, null),
              MONO("Monospace", Glyphs::mono, null),
              FULLWIDTH("Breit", Glyphs::fullwidth, null),
              SMALL_CAPS("Kapitaelchen", Glyphs::smallCaps, null),
              CIRCLED("Kreise", Glyphs::circled, null),
              CIRCLED_NEG("Kreise voll", s -> Glyphs.letters(s, 0x1F150), null),
              SQUARED("Quadrate", s -> Glyphs.letters(s, 0x1F130), null),
              SQUARED_NEG("Quadrate voll", s -> Glyphs.letters(s, 0x1F170), null),
              SUPER("Hochgestellt", Glyphs::superscript, null),
              UPSIDE("Kopfstand", Glyphs::upsideDown, null),
              SPACED("Gesperrt", s -> Glyphs.join(s, " "), null),
              DOTTED("Punktiert", s -> Glyphs.join(s, "·"), null),
              BOLD_SPACED("Fett gesperrt", s -> Glyphs.join(Glyphs.bold(s), " "), null),
              SCRIPT_SPACED("Schreibschrift gesperrt", s -> Glyphs.join(Glyphs.script(s), " "), null),
              SMALL_CAPS_SPACED("Kapitaelchen gesperrt", s -> Glyphs.join(Glyphs.smallCaps(s), " "), null),
              GALACTIC("Galaktisch", s -> s, "alt"),
              ILLAGER("Illager", s -> s, "illageralt"),
              UNIFORM("Uniform", s -> s, "uniform"),
              STARS("Sterne", s -> "\u2605 " + s + " \u2605", null),
              SPARKLE("Funkeln", s -> "\u2726 " + Glyphs.script(s) + " \u2726", null),
              CROWN("Krone", s -> "\u265B " + Glyphs.bold(s) + " \u265B", null),
              HEARTS("Herzen", s -> "\u2665 " + Glyphs.script(s) + " \u2665", null),
              ARROWS("Pfeile", s -> "\u00BB " + Glyphs.smallCaps(s) + " \u00AB", null),
              DIAMOND("Diamant", s -> "\u2756 " + Glyphs.boldFraktur(s) + " \u2756", null),
              MOON("Mond", s -> "\u263E " + Glyphs.sansBold(s) + " \u263D", null),
              BLOCK_SPACED("Sans fett gesperrt", s -> Glyphs.join(Glyphs.sansBold(s), " "), null),
              DOUBLE_SPACED("Doppelstrich gesperrt", s -> Glyphs.join(Glyphs.doubleStruck(s), " "), null),
              FRAKTUR_SPACED("Fraktur gesperrt", s -> Glyphs.join(Glyphs.boldFraktur(s), " "), null);

              public final String label;
              public final String fontId;
              private final UnaryOperator<String> fn;

              FontStyle(String label, UnaryOperator<String> fn, String fontId) {
                  this.label = label;
                  this.fn = fn;
                  this.fontId = fontId;
              }

              public String apply(String s) { return fn.apply(s); }
